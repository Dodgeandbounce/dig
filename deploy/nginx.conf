# Add inside the existing `server { ... }` block for commanderstitch.com.
# The game runs on 127.0.0.1:3000 (see dig.service or docker-compose.yml).

location = /dig { return 301 /dig/; }

location /dig/ {
    proxy_pass http://127.0.0.1:3000;     # no trailing slash: the /dig prefix is passed through
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;   # WebSockets
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;                    # keep idle game sockets open
}
