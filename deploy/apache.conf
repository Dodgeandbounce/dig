# Add inside the <VirtualHost *:443> for commanderstitch.com.
# Needs: a2enmod proxy proxy_http proxy_wstunnel rewrite
# The game runs on 127.0.0.1:3000 (see dig.service or docker-compose.yml).

RedirectMatch 301 ^/dig$ /dig/

# WebSocket first, then everything else under /dig/
ProxyPass        /dig/ws  ws://127.0.0.1:3000/dig/ws
ProxyPass        /dig/    http://127.0.0.1:3000/dig/
ProxyPassReverse /dig/    http://127.0.0.1:3000/dig/
ProxyPreserveHost On
ProxyTimeout 3600
