services:
  dig:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # only reachable through your nginx/Apache proxy
    environment:
      BASE_PATH: /dig
    volumes:
      - dig-data:/app/data      # saved ships survive rebuilds
    stop_grace_period: 15s

volumes:
  dig-data:
